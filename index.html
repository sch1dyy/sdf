<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#040206" />
    <meta
      name="description"
      content="忘れられた刃 — a lone katana left in a forgotten shrine. An interactive, PS1-style 3D scene."
    />
    <title>忘れられた刃 — The Forgotten Blade</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23040206'/%3E%3Crect x='7' y='1' width='2' height='9' fill='%23e8dfe6'/%3E%3Crect x='4' y='10' width='8' height='1' fill='%23c9a14e'/%3E%3Crect x='7' y='11' width='2' height='4' fill='%23c8294d'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas
      id="scene"
      tabindex="0"
      aria-label="A katana standing in the stone of an abandoned shrine. Drag to rotate it."
    ></canvas>

    <main class="title" id="title">
      <p class="title__eyebrow" lang="ja">奉納</p>
      <h1 class="title__name" lang="ja">忘れられた刃</h1>
      <p class="title__sub">THE FORGOTTEN BLADE</p>
      <div class="menu">
        <button class="menu__item" type="button" data-sound="on">
          <span lang="ja">音と共に</span>ENTER WITH SOUND
        </button>
        <button class="menu__item" type="button" data-sound="off">
          <span lang="ja">静寂のまま</span>ENTER IN SILENCE
        </button>
      </div>
    </main>

    <div class="hud" id="hud">
      <div class="hud__name" aria-hidden="true">
        <span lang="ja">忘れられた刃</span>
        <span class="hud__name-en">THE FORGOTTEN BLADE</span>
      </div>

      <div class="hud__seal" aria-hidden="true" lang="ja">刃</div>

      <dl class="hud__spec">
        <div>
          <dt lang="ja">銘</dt>
          <dd><span lang="ja">無銘</span><em>UNSIGNED</em></dd>
        </div>
        <div>
          <dt lang="ja">刃長</dt>
          <dd><span lang="ja">二尺三寸五分</span><em>71.2 CM</em></dd>
        </div>
        <div>
          <dt lang="ja">時代</dt>
          <dd><span lang="ja">室町</span><em>MUROMACHI</em></dd>
        </div>
      </dl>

      <p class="hud__hint" id="hint">
        <i aria-hidden="true"></i>
        DRAG TO ROTATE
        <span lang="ja">ドラッグで回転</span>
      </p>

      <div class="audio">
        <button class="music" id="music" type="button" aria-pressed="false" aria-label="Music on or off">
          <span class="music__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span lang="ja">音楽</span>
          <b id="music-state">OFF</b>
        </button>
        <div class="volume" role="group" aria-label="Music volume">
          <span class="volume__label" lang="ja" aria-hidden="true">音量</span>
          <button class="volume__step" id="volume-down" type="button" aria-label="Volume down">-</button>
          <input class="volume__slider" id="volume" type="range" min="0" max="100" step="1" value="70" aria-label="Music volume" />
          <button class="volume__step" id="volume-up" type="button" aria-label="Volume up">+</button>
          <output class="volume__value" id="volume-value" for="volume">70</output>
        </div>
      </div>
    </div>

    <button class="tag" id="inspect-tag" type="button" aria-label="Inspect Killua">
      <span>CLICK TO INSPECT</span>
      <i aria-hidden="true"></i>
    </button>

    <div class="inspect" id="inspect">
      <div class="hud__name inspect__name" aria-hidden="true">
        <span lang="ja">キルア＝ゾルディック</span>
        <span class="hud__name-en">KILLUA ZOLDYCK</span>
      </div>
      <button class="inspect__back" id="inspect-back" type="button"><span lang="ja">戻る</span>BACK</button>
      <p class="inspect__hint">DRAG TO ROTATE<span>SCROLL TO ZOOM</span></p>
    </div>

    <p class="fallback">This scene needs WebGL 2, which this browser could not start.</p>
    <noscript><p class="fallback fallback--show">This scene needs JavaScript and WebGL.</p></noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
